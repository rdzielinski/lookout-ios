name = "jarvis-brain"
main = "src/index.js"
compatibility_date = "2026-01-15"

# Conversation memory and long-term notes.
# Namespace ids are account-scoped handles rather than secrets, so this file is
# meant to be committed — but the id is only valid for the account wrangler is
# logged into. Confirm with `wrangler kv namespace list` if a deploy ever
# reports "KV namespace not found".
[[kv_namespaces]]
binding = "JARVIS_KV"
id = "e062910ffb984e6aba60a8e07d0d1c56"

[vars]
# Model used for conversation. Swap to "claude-sonnet-5" if you'd rather trade
# some depth for a faster first token — the request shape is identical.
CLAUDE_MODEL = "claude-opus-5"
# How long a conversation session survives without activity (seconds).
SESSION_TTL = "14400"
# Owner's home coordinates, used for weather when the client sends no location.
DEFAULT_LAT = "43.0117"
DEFAULT_LON = "-88.2315"

# Secrets — set these with `wrangler secret put <NAME>`, never in this file:
#   ANTHROPIC_API_KEY      Claude API key
#   JARVIS_API_TOKEN       Bearer token the iOS app sends (openssl rand -hex 32)
#   OPENWEATHER_API_KEY    optional, enables weather context
#   GOOGLE_CLIENT_ID       optional, enables calendar
#   GOOGLE_CLIENT_SECRET   optional, enables calendar
